<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercitando</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            background-color: aquamarine;
        }

        header {
            padding: 20px;
            text-align: center;
        }

        header > h1 {
            margin-bottom: 40px;
        }

        section {
            height: 100vh;
        }

        div {
            padding-top: 150px;
            text-align: center;
        }

        footer > h1 {
            color: white;
            text-align: center;
            background-color: grey;
            padding: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu Primeiro Cabeçalho</h1>
        <p>Meu primeiro parágrafo</p>
    </header>
    <main>
        <section>
            <div>
                <img src="icons/html-5.png" alt="Icon do HTML5">
                <img src="icons/css-3.png" alt="Icone do CSS3">
            </div>
        </section>
    </main>
    <footer>
        <h1>Footer</h1>
    </footer>
</body>
</html>
